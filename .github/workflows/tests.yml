name: Monorepo Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dyvin
          POSTGRES_PASSWORD: dyvin_secret_password
          POSTGRES_DB: dyvin_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @dyvin-ai/backend prisma generate
        env:
          DATABASE_URL: 'postgresql://dyvin:dyvin_secret_password@localhost:5432/dyvin_db?schema=public'

      - name: Build Shared
        run: pnpm --filter @dyvin-ai/shared build

      - name: Run All Tests
        run: pnpm test
        env:
          DATABASE_URL: 'postgresql://dyvin:dyvin_secret_password@localhost:5432/dyvin_db?schema=public'
