name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dyvin
          POSTGRES_PASSWORD: dyvin_secret_password
          POSTGRES_DB: dyvin_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get PNPM Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @dyvin-ai/backend prisma generate
        env:
          DATABASE_URL: "postgresql://dyvin:dyvin_secret_password@localhost:5432/dyvin_db?schema=public"

      - name: Build Shared
        run: pnpm --filter @dyvin-ai/shared build

      - name: Type Check & Lint
        run: |
          pnpm --filter @dyvin-ai/backend typecheck
          pnpm --filter @dyvin-ai/backend lint

      - name: Run Tests
        run: pnpm --filter @dyvin-ai/backend test
        env:
          DATABASE_URL: "postgresql://dyvin:dyvin_secret_password@localhost:5432/dyvin_db?schema=public"

      - name: Build Backend
        run: pnpm --filter @dyvin-ai/backend build
